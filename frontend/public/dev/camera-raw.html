<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raw Camera Ground Truth Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e6e8ec;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #181b22;
      border: 1px solid #2d3340;
      border-radius: 8px;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .video-wrap {
      position: relative;
      background: #000;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #2ea043;
    }
    button.stop {
      background: #da3633;
    }
    button.stop:hover {
      background: #f85149;
    }
    button.secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    button.secondary:hover {
      background: #30363d;
    }
    .metrics {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .metrics div {
      display: flex;
      justify-content: space-between;
    }
    .log-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      height: 120px;
      overflow-y: auto;
      color: #8b949e;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Raw Camera Ground Truth Test</h1>
    <p>Zero React, zero framer-motion, zero external styles. Pure browser MediaStream API.</p>

    <div class="video-wrap">
      <video id="v" autoplay playsinline muted></video>
    </div>

    <div class="btn-row">
      <button id="btnStart" onclick="startCamera()">Start Camera</button>
      <button id="btnStop" class="stop" onclick="stopCamera()">Stop Camera</button>
      <button class="secondary" onclick="copyReport()">Copy Report</button>
    </div>

    <div class="metrics" id="metrics">
      <div><span>Status:</span> <span id="mStatus">IDLE</span></div>
      <div><span>Device:</span> <span id="mDevice">-</span></div>
      <div><span>Resolution:</span> <span id="mRes">0 x 0</span></div>
      <div><span>Frame Count:</span> <span id="mFrames">0</span></div>
      <div><span>FPS:</span> <span id="mFps">0</span></div>
      <div><span>Tracks:</span> <span id="mTracks">none</span></div>
    </div>

    <div class="log-box" id="logBox">Logs will appear here...</div>
  </div>

  <script>
    const v = document.getElementById('v');
    const mStatus = document.getElementById('mStatus');
    const mDevice = document.getElementById('mDevice');
    const mRes = document.getElementById('mRes');
    const mFrames = document.getElementById('mFrames');
    const mFps = document.getElementById('mFps');
    const mTracks = document.getElementById('mTracks');
    const logBox = document.getElementById('logBox');

    let stream = null;
    let frameCount = 0;
    let lastTime = performance.now();
    let animId = null;

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logBox.textContent += line;
      logBox.scrollTop = logBox.scrollHeight;
      console.log(msg);
    }

    async function startCamera() {
      stopCamera();
      mStatus.textContent = 'REQUESTING...';
      log('Requesting getUserMedia({ video: true, audio: false })...');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: false
        });
        v.srcObject = stream;
        await v.play();
        mStatus.textContent = 'LIVE';
        log('Camera stream acquired and playing.');

        const track = stream.getVideoTracks()[0];
        if (track) {
          const settings = track.getSettings ? track.getSettings() : {};
          mDevice.textContent = track.label || 'Default Camera';
          mTracks.textContent = `${track.kind} (${track.readyState}, enabled=${track.enabled}, muted=${track.muted})`;
          log(`Track info: ${track.label}, ID: ${track.id}`);
        }

        frameCount = 0;
        lastTime = performance.now();
        trackFrames();
      } catch (err) {
        mStatus.textContent = 'ERROR';
        log(`Camera error: ${err.name} - ${err.message}`);
      }
    }

    function trackFrames() {
      if (!stream) return;
      if ('requestVideoFrameCallback' in v) {
        v.requestVideoFrameCallback((now, metadata) => {
          frameCount++;
          updateStats(now);
          trackFrames();
        });
      } else {
        const poll = () => {
          if (!stream) return;
          if (v.currentTime > 0) frameCount++;
          updateStats(performance.now());
          animId = requestAnimationFrame(poll);
        };
        animId = requestAnimationFrame(poll);
      }
    }

    let lastDisplayUpdate = 0;
    function updateStats(now) {
      if (now - lastDisplayUpdate > 500) {
        mFrames.textContent = frameCount;
        mRes.textContent = `${v.videoWidth} x ${v.videoHeight}`;
        const elapsed = (now - lastTime) / 1000;
        if (elapsed > 0) {
          mFps.textContent = (frameCount / elapsed).toFixed(1);
        }
        lastDisplayUpdate = now;
      }
    }

    function stopCamera() {
      if (animId) cancelAnimationFrame(animId);
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        v.srcObject = null;
        mStatus.textContent = 'STOPPED';
        mTracks.textContent = 'none';
        log('Camera stopped and tracks released.');
      }
    }

    function copyReport() {
      const report = {
        status: mStatus.textContent,
        device: mDevice.textContent,
        resolution: mRes.textContent,
        frames: mFrames.textContent,
        fps: mFps.textContent,
        tracks: mTracks.textContent,
        logs: logBox.textContent
      };
      navigator.clipboard.writeText(JSON.stringify(report, null, 2));
      alert('Report copied to clipboard!');
    }
  </script>
</body>
</html>
